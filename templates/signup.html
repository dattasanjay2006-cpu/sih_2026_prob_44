<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | AIC Portal</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='signup.css') }}">
</head>

<body>

<header class="navbar">

    <div class="logo">
        <h2>AIC Portal</h2>
        <span>Academia Industry Collaboration</span>
    </div>

    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="#">Students</a>
        <a href="{{ url_for('assess') }}">Assess Skills</a>
        <a href="#">Internships</a>
        <a href="{{ url_for('profile') }}">My Profile</a>
    </nav>

    <div class="search-box">
        <span>🔍</span>
        <input type="text" placeholder="Search students, skills, internships...">
    </div>

</header>

<main class="signup-container">

    <div class="signup-box">

        <div class="signup-heading">
            <h1>Create Account</h1>
            <p>Join the AIC Portal</p>
        </div>

        {% if error %}
            <p class="signup-error">{{ error }}</p>
        {% endif %}

        <form action="{{ url_for('signup') }}" method="POST">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       placeholder="Enter username" required>
            </div>

            <div class="form-group">
                <label for="contact">Mobile Number / Email ID</label>
                <input type="text" id="contact" name="contact"
                       placeholder="Enter mobile number or email ID" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Create password" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password"
                       placeholder="Confirm password" required>
            </div>

            <button type="submit" class="signup-btn">
                Create Account
            </button>

        </form>

        <p class="login-text">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>

    </div>

</main>

</body>
</html>

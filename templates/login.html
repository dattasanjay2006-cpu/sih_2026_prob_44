<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | AIC Portal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            <h2>AIC Portal</h2>
            <span>Academia Industry Collaboration</span>
        </div>

        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="#">Students</a>
            <a href="{{ url_for('assess') }}">Assess Skills</a>
            <a href="#">Internships</a>
            <a href="{{ url_for('profile') }}">My Profile</a>
        </nav>

        <div class="search-box">
            <span>🔍</span>
            <input type="text" placeholder="Search students, skills, internships...">
        </div>

    </header>


    <main class="login-container">

        <div class="login-box">

            <div class="login-heading">
                <h1>Welcome Back</h1>
                <p>Login to your AIC Portal account</p>
            </div>


            <form action="{{url_for('login')}}" method="POST">

                <div class="form-group">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="contact">Mobile Number / Email ID</label>

                    <input
                        type="text"
                        id="contact"
                        name="contact"
                        placeholder="Enter mobile number or email ID"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>


                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>


            <p class="signup-text">
                Don't have an account?
                <a href="{{ url_for('signup') }}">Sign Up</a>
            </p>

        </div>

    </main>

</body>
</html>
